<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduNaija - E-Learning Quiz Platform</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Header -->
    <header class="navbar">
      <div class="logo">EduNaija 🎓</div>
      <p class="tagline">Empowering Practice & Exam Preparation</p>
    </header>

    <!-- Main Container -->
    <main class="container">
      <!-- Quiz List View -->
      <section id="quiz-list-section">
        <h2>Available Practice Quizzes</h2>
        <p>Select a subject to begin testing your knowledge:</p>
        <div id="quiz-grid" class="quiz-grid">
          <p class="loading">Loading quizzes...</p>
        </div>
      </section>

      <!-- Quiz Taking View -->
      <section id="quiz-view" class="quiz-container hidden">
        <div class="quiz-header">
          <div>
            <button id="back-btn" class="btn-secondary">← Back</button>
            <h2
              id="active-quiz-title"
              style="display: inline-block; margin-left: 1rem"
            >
              Quiz Title
            </h2>
          </div>
          <!-- Dynamic Timer -->
          <div id="timer-display" class="timer-badge">⏱️ 02:00</div>
        </div>

        <div id="questions-container"></div>

        <button id="submit-btn" class="btn-primary hidden">Submit Quiz</button>
      </section>

      <!-- Results View -->
      <section id="result-view" class="result-container hidden">
        <h2>Quiz Complete!</h2>
        <div id="score-display" class="score-circle">0%</div>
        <p id="feedback-message">Calculating your score...</p>
        <button id="home-btn" class="btn-primary">Return Home</button>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
